name: Quality checks

on:
  push:
    branches:
      - main
      - "feat/**"
      - "agent/**"
  pull_request:

permissions:
  contents: write

concurrency:
  group: estateflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://estateflow:ci-password@localhost:5432/estateflow_ci
      DIRECT_URL: postgresql://estateflow:ci-password@localhost:5432/estateflow_ci

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fix public property photo URLs
        run: python3 scripts/fix_public_photo_urls.py

      - name: Apply public portal UX repair
        run: python3 scripts/repair_public_portal.py

      - name: Commit public portal UX repair
        run: |
          if ! git diff --quiet -- src/pages/PublicPropertiesPage.tsx; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add src/pages/PublicPropertiesPage.tsx
            git commit -m "Fix public portal WhatsApp, photos and mobile scrolling"
            git push
          fi

      - name: Validate Prisma schema
        run: npm run prisma:validate

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Run tests
        run: npm run test

      - name: Run server tests
        run: npm run test:server

      - name: Run lint
        run: npm run lint

      - name: Build production app
        run: npm run build

      - name: Verify generated client is current
        run: git diff --exit-code -- prisma
